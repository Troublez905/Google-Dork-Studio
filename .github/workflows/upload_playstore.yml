name: Upload to Google Play (AAB)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm ci
      - name: Build web assets
        run: npm run build --if-present
      - name: Prepare Android (Capacitor)
        run: |
          if [ -d "android" ]; then echo "Android folder exists"; else npx cap add android || true; fi
      - name: Build Android AAB
        run: |
          cd android && ./gradlew bundleRelease -x lint
      - name: Upload AAB to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.troublez.googledorkstudio
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal

# Required secrets:
# - PLAY_SERVICE_ACCOUNT_JSON: JSON content of a Google Play service account with 'Google Play Android Developer' permissions (store as secret)
# - (Optional) If you use a different packageName or track, adjust inputs above.
