[build]
  # Site is a static repo — publish the repository root
  base = "."
  command = "echo 'No build: static site'"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Security headers for the entire site
[[headers]]
for = "/*"
[headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Non-indexing and no-store for the owner dashboard
[[headers]]
for = "/dashboard.html"
[headers.values]
  X-Robots-Tag = "noindex, nofollow, noarchive"
  Cache-Control = "no-store"

# Cache assets aggressively where appropriate
[[headers]]
for = "/assets/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Function routes are declared in code and take precedence over this SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
